name: NUR Interface Lag Hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-validate-commit:
    if: >-
      github.event.pull_request.head.ref == 'perf/interface-lag-hotfix-20260812' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply guarded Star Brain performance patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime_path = Path('apps/web/src/bridge/v43StarBrainRuntime.js')
          text = runtime_path.read_text()

          replacements = [
              (
                  "const MIN_FRAME_GAP=MOBILE?(GALAXY_PRESENT?66:40):(GALAXY_PRESENT?50:30);",
                  "const IDLE_FRAME_GAP=MOBILE?(GALAXY_PRESENT?66:40):(GALAXY_PRESENT?67:30);\n"
                  "  const ACTIVE_FRAME_GAP=MOBILE?IDLE_FRAME_GAP:(GALAXY_PRESENT?34:30);",
              ),
              (
                  "// at 20Hz it is indistinguishable from 33Hz — while the star field carries the",
                  "// at ~15Hz the idle drift remains continuous while the star field carries the",
              ),
              (
                  "let energy=0;                  // storm brightness boost\n  let breath=0;",
                  "let energy=0;                  // storm brightness boost\n"
                  "  let physicsActive=false;       // idle anatomy has no spring work to integrate\n"
                  "  let breath=0;",
              ),
              (
                  "energy=Math.min(1.6, energy+power);\n    const n=Math.round(10+16*power);",
                  "energy=Math.min(1.6, energy+power);\n"
                  "    physicsActive=true;\n"
                  "    const n=Math.round(10+16*power);",
              ),
              (
                  "mode='shatter'; modeT=0;\n    pulses.length=0;",
                  "mode='shatter'; modeT=0;\n"
                  "    physicsActive=true;\n"
                  "    pulses.length=0;",
              ),
              (
                  "if(lastFrame&&now-lastFrame<MIN_FRAME_GAP) return;",
                  "const interactive=dragging||mode!=='live'||energy>.12||hoverX>-1000;\n"
                  "    const frameGap=interactive?ACTIVE_FRAME_GAP:IDLE_FRAME_GAP;\n"
                  "    if(lastFrame&&now-lastFrame<frameGap) return;",
              ),
              (
                  "// jelly physics: spring back to true anatomy\n    for(const p of pts){\n      p.vx+=-springK*p.ox; p.vy+=-springK*p.oy; p.vz+=-springK*p.oz;\n      p.vx*=dampK; p.vy*=dampK; p.vz*=dampK;\n      p.ox+=p.vx; p.oy+=p.vy; p.oz+=p.vz;\n    }",
                  "// Jelly physics only runs while an interaction has actually displaced the rig.\n"
                  "    // In steady-state every velocity and offset is zero, so integrating ~2k no-op\n"
                  "    // springs every paint frame only steals CPU from the full-screen galaxy.\n"
                  "    if(physicsActive||mode!=='live'){\n"
                  "      let moving=mode!=='live';\n"
                  "      for(const p of pts){\n"
                  "        p.vx+=-springK*p.ox; p.vy+=-springK*p.oy; p.vz+=-springK*p.oz;\n"
                  "        p.vx*=dampK; p.vy*=dampK; p.vz*=dampK;\n"
                  "        p.ox+=p.vx; p.oy+=p.vy; p.oz+=p.vz;\n"
                  "        const settled=Math.abs(p.vx)<1e-5&&Math.abs(p.vy)<1e-5&&Math.abs(p.vz)<1e-5\n"
                  "          &&Math.abs(p.ox)<1e-4&&Math.abs(p.oy)<1e-4&&Math.abs(p.oz)<1e-4;\n"
                  "        if(settled){ p.vx=p.vy=p.vz=p.ox=p.oy=p.oz=0; }\n"
                  "        else moving=true;\n"
                  "      }\n"
                  "      physicsActive=moving;\n"
                  "    }",
              ),
              (
                  "a*=1+.9*k;\n        p.vx+=(p.x)*.0016*k; p.vy+=(p.y)*.0016*k; p.vz+=(p.z)*.0016*k;",
                  "a*=1+.9*k;\n"
                  "        physicsActive=true;\n"
                  "        p.vx+=(p.x)*.0016*k; p.vy+=(p.y)*.0016*k; p.vz+=(p.z)*.0016*k;",
              ),
              (
                  "staticFramePainted,\n      stageVisible:stageIsVisible()",
                  "staticFramePainted,\n"
                  "      stageVisible:stageIsVisible(),\n"
                  "      physicsActive,\n"
                  "      idleFrameGap:IDLE_FRAME_GAP,\n"
                  "      activeFrameGap:ACTIVE_FRAME_GAP",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed: expected exactly one occurrence, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)

          runtime_path.write_text(text)

          old_hash = '19ce9ac65b1ccc34e7b07179d72bbf4054c713a83b954e56cbf6ce38adf58102'
          new_hash = 'd77b5224d777e4e171ed722170ff51ec3602e125df5bd64bd09b600b5f76832e'
          source_test_path = Path('apps/web/src/v197/v43-star-brain-source.test.ts')
          phase_test_path = Path('apps/web/src/v197/phase1-host.test.ts')

          for test_path in (source_test_path, phase_test_path):
              test_text = test_path.read_text()
              count = test_text.count(old_hash)
              if count != 1:
                  raise SystemExit(f'guard failed: expected one old Star Brain hash in {test_path}, found {count}')
              test_path.write_text(test_text.replace(old_hash, new_hash, 1))

          source_test = source_test_path.read_text()
          anchor = '    expect(runtime).toContain("canvas.id = \'nur-brain-canvas\';");\n'
          perf_assertions = (
              '    // Idle rendering yields CPU to the full-screen galaxy without degrading active input.\n'
              '    expect(runtime).toContain("const IDLE_FRAME_GAP=MOBILE?(GALAXY_PRESENT?66:40):(GALAXY_PRESENT?67:30);");\n'
              '    expect(runtime).toContain("const ACTIVE_FRAME_GAP=MOBILE?IDLE_FRAME_GAP:(GALAXY_PRESENT?34:30);");\n'
              '    expect(runtime).toContain("let physicsActive=false");\n'
              '    expect(runtime).toContain("if(physicsActive||mode!==\'live\')");\n'
              '    expect(runtime).toContain("const frameGap=interactive?ACTIVE_FRAME_GAP:IDLE_FRAME_GAP;");\n'
          )
          if source_test.count(anchor) != 1:
              raise SystemExit('guard failed: source-test assertion anchor drifted')
          source_test_path.write_text(source_test.replace(anchor, perf_assertions + anchor, 1))

          adaptive_path = Path('apps/web/e2e/v197-adaptive-performance.spec.ts')
          adaptive = adaptive_path.read_text()
          destructuring = '  const { entry, universe } = await universeFrame(page);'
          if adaptive.count(destructuring) != 2:
              raise SystemExit(f'guard failed: expected two stale Entry destructurings, found {adaptive.count(destructuring)}')
          adaptive = adaptive.replace(destructuring, '  const { universe } = await universeFrame(page);')

          start_marker = '  const hiddenEntry = await entry.locator("html").evaluate(element => {'
          end_marker = '  expect(hiddenEntry.runningInfinite, JSON.stringify(hiddenEntry.runningTargets, null, 2)).toBe(0);'
          if adaptive.count(start_marker) != 1 or adaptive.count(end_marker) != 1:
              raise SystemExit(
                  f'guard failed: hidden-Entry boundaries drifted: start={adaptive.count(start_marker)} end={adaptive.count(end_marker)}'
              )
          start = adaptive.index(start_marker)
          end = adaptive.index(end_marker, start) + len(end_marker)
          retired_entry = (
              '  // Authenticated Universe retires the Entry iframe entirely; absence is stronger\n'
              '  // than keeping a hidden frame around and trying to police its animations.\n'
              '  await expect(page.locator("#nur-entry-stage")).toHaveCount(0);\n'
              '  await expect(page.locator("html")).toHaveAttribute("data-nur-entry-retired", "true");'
          )
          adaptive = adaptive[:start] + retired_entry + adaptive[end:]

          stale_reduced = '  await expect(entry.locator("html")).toHaveClass(/nur-stage-inactive/);'
          if adaptive.count(stale_reduced) != 1:
              raise SystemExit('guard failed: stale reduced-motion Entry assertion drifted')
          adaptive = adaptive.replace(
              stale_reduced,
              '  await expect(page.locator("#nur-entry-stage")).toHaveCount(0);\n'
              '  await expect(page.locator("html")).toHaveAttribute("data-nur-entry-retired", "true");',
              1,
          )
          adaptive_path.write_text(adaptive)
          PY

          git diff --check
          node --check apps/web/src/bridge/v43StarBrainRuntime.js
          sha256sum apps/web/src/bridge/v43StarBrainRuntime.js | grep -Fq d77b5224d777e4e171ed722170ff51ec3602e125df5bd64bd09b600b5f76832e
          git --no-pager diff -- apps/web/src/bridge/v43StarBrainRuntime.js apps/web/src/v197/v43-star-brain-source.test.ts apps/web/src/v197/phase1-host.test.ts apps/web/e2e/v197-adaptive-performance.spec.ts

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run web:typecheck

      - name: Unit tests
        run: npm run web:test

      - name: Production build
        run: npm run web:build

      - name: Mocked browser regression suite
        run: npm run web:e2e:mocked

      - name: Adaptive Systems performance regression
        run: npm --workspace apps/web run e2e -- e2e/v197-adaptive-performance.spec.ts --project=chromium-desktop --workers=1

      - name: Assert optimized runtime diagnostics
        shell: bash
        run: |
          grep -Fq "const IDLE_FRAME_GAP=MOBILE?(GALAXY_PRESENT?66:40):(GALAXY_PRESENT?67:30);" apps/web/src/bridge/v43StarBrainRuntime.js
          grep -Fq "let physicsActive=false" apps/web/src/bridge/v43StarBrainRuntime.js
          grep -Fq "if(physicsActive||mode!=='live')" apps/web/src/bridge/v43StarBrainRuntime.js
          grep -Fq "physicsActive=true" apps/web/src/bridge/v43StarBrainRuntime.js
          grep -Fq 'toHaveAttribute("data-nur-entry-retired", "true")' apps/web/e2e/v197-adaptive-performance.spec.ts

      - name: Commit only after every validation passed
        shell: bash
        env:
          HOTFIX_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nur-interface-lag-hotfix.yml
          git add apps/web/src/bridge/v43StarBrainRuntime.js apps/web/src/v197/v43-star-brain-source.test.ts apps/web/src/v197/phase1-host.test.ts apps/web/e2e/v197-adaptive-performance.spec.ts
          git diff --cached --check
          git commit -m "perf(web): stop idle Star Brain from stealing galaxy frame budget"
          git push origin "HEAD:${HOTFIX_BRANCH}"
